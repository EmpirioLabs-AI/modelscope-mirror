name: Mirror to ModelScope

# Copies every public, ungated model and dataset of huggingface.co/empiriolabsai to the ModelScope account
# empiriolabs, file for file (mirror.py). The plan job reads both sides with no credential. Each sync job copies
# one repository with the ModelScope token, a secret of the modelscope environment, which deploys only from main
# and has no reviewer on purpose: the copy follows Hugging Face without a manual step. The sync job runs only
# mirror.py, which uses the Python standard library, so it installs nothing.
#
# No schedule here: GitHub stops scheduled workflows in a public repository after 60 days without a commit.
# heartbeat.yml starts this workflow, and a Hugging Face release starts it too, so it never depends on one
# schedule. The record job commits mirrored.json and the README table whenever a copy changes.

on:
  workflow_dispatch:
    inputs:
      only:
        description: Repository names to check and copy, separated by spaces (empty for all)
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: modelscope-mirror
  cancel-in-progress: false

jobs:
  # HF_TOKEN, a read-only Hugging Face token in the modelscope environment, reads our gated repositories; without
  # it a gated repository is not copied. The plan and record jobs reference only it, never the ModelScope token.
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: modelscope
    outputs:
      repos: ${{ steps.plan.outputs.repos }}
      any: ${{ steps.plan.outputs.any }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Compare Hugging Face and ModelScope
        id: plan
        env:
          MIRROR_ONLY: ${{ inputs.only }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 mirror.py plan

  sync:
    needs: plan
    if: needs.plan.outputs.any == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 355
    environment: modelscope
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        repo: ${{ fromJSON(needs.plan.outputs.repos) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Uploads that could not finish within five hours are left for the next run, which the record job starts.
      - name: Copy one repository
        env:
          MODELSCOPE_TOKEN: ${{ secrets.MODELSCOPE_TOKEN }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          REPO: ${{ matrix.repo }}
        run: |
          mkdir -p results
          python3 mirror.py sync "$REPO" --seconds 18000 --result "results/${REPO//\//_}.json"

      - name: Keep the result
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: result-${{ strategy.job-index }}
          path: results/
          if-no-files-found: ignore
          retention-days: 7

  # Runs after every plan, a copy or not: each run re-checks every repository and fails loudly on any difference.
  record:
    needs: [plan, sync]
    if: always() && needs.plan.result == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: modelscope
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: result-*
          path: results
          merge-multiple: true

      - name: Check every repository and record the copies
        id: record
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: python3 mirror.py record results || echo "failed=true" >> "$GITHUB_OUTPUT"

      - name: Commit the record
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- README.md mirrored.json; then
            echo "Nothing changed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md mirrored.json
          git commit -m "Record the ModelScope copies"
          auth=$(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 -w0)
          echo "::add-mask::$auth"
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" pull --rebase --quiet origin main
          git -c http.https://github.com/.extraheader="AUTHORIZATION: basic $auth" push origin HEAD:main

      - name: Continue a copy that ran out of time
        if: steps.record.outputs.continue == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mirror.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"

      - name: Fail when anything is not copied
        if: steps.record.outputs.failed == 'true'
        run: |
          echo "::error::Some repositories are not copied; the record step names them."
          exit 1
