name: Heartbeat

# Starts the mirror every six hours. A Hugging Face release starts it as well, so if GitHub ever stops this
# schedule after 60 days without a commit, only this heartbeat stops, never the mirror itself.

on:
  schedule:
    - cron: "41 */6 * * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  start:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Start the mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run mirror.yml --repo "$GITHUB_REPOSITORY" --ref "$GITHUB_REF_NAME"
